<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">


<link href="https://fonts.googleapis.com/css2?family=Asset&family=Barlow+Condensed:wght@500;600;700&family=Ewert&family=Lobster&family=Orbitron:wght@500;600;700&family=Oswald:wght@500;600;700&family=Rajdhani:wght@600;700&family=Story+Script&family=Teko:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --alive-team-bg: linear-gradient(100deg,#21004b 0%,#6d28d9 52%,#3b0764 100%);
    --finished-team-bg: linear-gradient(100deg,#111827 0%,#030712 100%);
    --table-header-bg: linear-gradient(100deg,#c084fc 0%,#7c3aed 48%,#4c1d95 100%);
    --table-font-color:#ffffff;
    --counter-bg:#1e1b4b;
    --counter-text-color:#ffffff;
    --counter-bar-height:34px;
    --status-bar-active:#00ff9d;
    --status-bar-finished:#ef4444;
    --top5-card-bg: linear-gradient(90deg,rgba(57, 0, 117, 1) 0%, rgba(89, 0, 153, 1) 52%, rgba(75, 0, 130, 1) 100%);
    --popup-bg: linear-gradient(90deg,#7c3aed,#9333ea);
    --data-left-bg:#f7f7f2;
    --data-right-bg:#08272a;
    --data-left-font-color:#ffffff;
    --data-right-font-color:#ffffff;
    --map-text-color:#ffffff;
    --popup-text-color:#ffffff;
    --top5-text-color:#ffffff;
    --style-accent-color:#22d3ee;
    --style-accent-soft:rgba(34,211,238,0.18);
    --table-width:320px;
    --table-row-height:34px;
    --table-row-font-size:13px;
    --table-header-font-size:12px;
    --table-logo-size:18px;
    --table-bar-height:14px;
    --status-bar-width:10px;
    --status-bar-gap:2px;
    --status-bar-height:14px;
    --status-bar-radius:2px;
    --status-bar-animation-speed:450ms;
    --row-border-thickness:1px;
    --row-divider-width:1px;
    --table-col-rank-width:22px;
    --table-col-team-width:220px;
    --table-col-chicken-width:30px;
    --table-col-kills-width:30px;
    --table-col-total-width:32px;
    --table-col-status-width:45px;
    --table-row-pad-x:8px;
    --top5-scale:1;
    --popup-scale:1;
    --popup-scale-hidden:0.9;
    --overlay-font:'Rajdhani', sans-serif;
}

body{
    margin:0;
    font-family:var(--overlay-font);
    color:var(--table-font-color);
    overflow:hidden;
    opacity:0;
    transition:opacity 0.15s ease;
}

body.ready{
    opacity:1;
}

.win-chance{
    position:absolute;
    top:calc(52px + var(--win-chance-offset-y, 0px));
    left:calc(50% + var(--win-chance-offset-x, 0px));
    transform:translateX(-50%);
    display:flex;
    gap:28px;
    align-items:flex-start;
    justify-content:center;
    z-index:8;
    pointer-events:none;
}

.win-card{
    width:185px;
    background:#0b2f34;
    border:1px solid rgba(0,255,220,0.45);
    box-shadow:0 10px 28px rgba(0,0,0,0.55);
}

.win-card-main{
    display:grid;
    grid-template-columns:64px 1fr;
    align-items:center;
    min-height:70px;
    background:rgba(6,35,39,0.94);
}

.win-logo{
    width:54px;
    height:54px;
    object-fit:contain;
    margin:0 auto;
}

.win-bars{
    display:flex;
    justify-content:center;
    gap:7px;
}

.win-card .bar{
    width:13px;
    height:48px;
}

.win-label{
    background:linear-gradient(90deg,#069f9b,#18d3cc);
    color:#eaffff;
    text-align:center;
    font-size:24px;
    font-weight:900;
    line-height:1;
    padding:8px 4px 7px;
    text-shadow:0 2px 2px rgba(0,0,0,0.45);
    white-space:nowrap;
}

.win-chance:empty{
    display:none;
}

/* ================= TOP 5 ================= */
.top5{
    position:absolute;
    top:5px;
    left:50%;
    transform:translateX(-50%);
    scale:var(--top5-scale);
    transform-origin:center top;
    display:flex;
    gap:12px;
}

.top5[data-top5-orientation="vertical"]{
    flex-direction:column;
    gap:10px;
}

.top-card{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--top5-card-bg);
    border:1px solid rgba(0,234,255,0.4);
    padding:12px 16px;
    border-radius:10px;
    width:220px;
    box-shadow:0 0 15px rgba(0,234,255,0.3);
    clip-path:polygon(6% 0%, 70% 0, 90% 100%, 6% 100%);
}

.top-logo{
    width:70px;
    height:70px;
    border:2px solid white;
    border-radius:8px;
}

.top-text{
    line-height:1.3;
    font-size:14px;
    color:var(--top5-text-color);
}

.top5[data-top5-style="bgmi"] .top-card{
    border:2px solid rgba(245,158,11,0.85);
    border-radius:4px;
    box-shadow:0 0 24px rgba(245,158,11,0.35), 0 12px 30px rgba(0,0,0,0.75);
}

.top5[data-top5-style="neon"] .top-card{
    border:1px solid var(--style-accent-color);
    border-radius:12px;
    clip-path:none;
    color:var(--style-accent-color);
    backdrop-filter:blur(10px);
    box-shadow:0 18px 48px rgba(0,0,0,0.75), 0 0 18px var(--style-accent-color), inset 0 0 18px var(--style-accent-soft);
}

.top5[data-top5-style="compact"]{
    gap:6px;
}

.top5[data-top5-style="compact"] .top-card{
    gap:8px;
    width:170px;
    padding:8px 10px;
    border-radius:3px;
    clip-path:none;
}

.top5[data-top5-style="compact"] .top-logo{
    width:44px;
    height:44px;
}

.top5[data-top5-style="compact"] .top-text{
    font-size:12px;
    line-height:1.15;
}

.top5[data-top5-style="glass"] .top-card{
    background:
        linear-gradient(rgba(15,23,42,0.38), rgba(15,23,42,0.38)),
        var(--top5-card-bg);
    background-blend-mode:normal, screen;
    border:1px solid rgba(255,255,255,0.28);
    border-radius:12px;
    clip-path:none;
    backdrop-filter:blur(10px);
    box-shadow:0 18px 48px rgba(0,0,0,0.75), inset 0 1px 0 rgba(255,255,255,0.18);
}

.top5[data-top5-style="curve_dark"] .top-card{
    border-left:2px solid rgba(255,255,255,0.45);
    border-right:7px solid var(--style-accent-color);
    border-top:0;
    border-bottom:0;
    border-radius:0;
    clip-path:polygon(0 0, calc(100% - 24px) 0, 100% 50%, calc(100% - 24px) 100%, 0 100%);
    box-shadow:0 3px 0 rgba(167,243,208,0.25);
}

.top5[data-top5-style="curve_dark"] .top-logo{
    border-radius:2px;
}

.top5[data-top5-style="curve_light"] .top-card{
    border:0;
    border-radius:999px;
    clip-path:none;
    background:var(--top5-card-bg);
    box-shadow:0 12px 28px rgba(0,0,0,0.7);
}

.top5[data-top5-style="curve_light"] .top-logo{
    border-color:#64748b;
    border-radius:999px;
}

.top5[data-top5-style="scoreboard"] .top-card{
    background:var(--alive-team-bg);
    border:2px solid #071e22;
    border-radius:0;
    clip-path:none;
    color:var(--table-font-color);
    box-shadow:0 10px 28px rgba(0,0,0,0.65);
}

.top5[data-top5-style="scoreboard"] .top-logo{
    border:0;
    border-radius:0;
    object-fit:contain;
}

.top5[data-top5-animation="pop"] .top-card{
    animation:top5Pop 0.38s ease;
}

.top5[data-top5-animation="slide"] .top-card,
.top5[data-top5-animation="slide_io"] .top-card{
    animation:top5Slide 0.42s cubic-bezier(.2,.8,.2,1);
}

.top5[data-top5-animation="smooth"] .top-card{
    animation:top5Smooth 0.7s cubic-bezier(.2,.8,.2,1);
}

.top5[data-top5-animation="fade_io"] .top-card{
    animation:top5Fade 0.42s ease;
}

.top5[data-top5-animation="none"] .top-card{
    animation:none;
}

@keyframes top5Pop{
    0%{ transform:scale(0.92); filter:brightness(1.6); }
    100%{ transform:scale(1); filter:brightness(1); }
}

@keyframes top5Slide{
    0%{ transform:translateY(-30px); opacity:0; }
    100%{ transform:translateY(0); opacity:1; }
}

@keyframes top5Smooth{
    0%{ transform:translateY(-16px); opacity:0.45; }
    100%{ transform:translateY(0); opacity:1; }
}

@keyframes top5Fade{
    0%{ opacity:0; filter:brightness(1.4); }
    100%{ opacity:1; filter:brightness(1); }
}

/* ================= PREMIUM POPUP ================= */
#finishBanner{
    position:absolute;
    top:calc(180px + var(--popup-offset-y, 0px));
    left:calc(50% + var(--popup-offset-x, 0px));
    transform:translateX(-50%) scale(var(--popup-scale-hidden));

    display:flex;
    align-items:stretch;

   background: linear-gradient(90deg,rgba(255, 255, 255, 0) 0%, rgba(87, 199, 133, 0) 50%, rgba(237, 221, 83, 0.15) 100%);

    clip-path:polygon(0 0, 85% 0, 100% 100%, 0% 100%);

    overflow:hidden;

    border:1px solid rgba(255,255,255,0.1);

    box-shadow:
        0 10px 40px rgba(0,0,0,0.8),
        0 0 20px rgba(0,234,255,0.2);

    opacity:0;
    transition:0.35s ease;
    color:var(--popup-text-color);
}

#finishBanner.show{
    opacity:1;
    transform:translateX(-50%) scale(var(--popup-scale));
}

#finishBanner[data-popup-style="bgmi"]{
    border:2px solid rgba(245,158,11,0.75);
    box-shadow:0 0 24px rgba(245,158,11,0.35), 0 12px 36px rgba(0,0,0,0.85);
}

#finishBanner[data-popup-style="neon"]{
    border:1px solid var(--style-accent-color);
    border-radius:12px;
    clip-path:none;
    backdrop-filter:blur(10px);
    box-shadow:0 0 18px var(--style-accent-color), inset 0 0 18px var(--style-accent-soft), 0 10px 40px rgba(0,0,0,0.8);
}

#finishBanner[data-popup-style="compact"] .left-box img{
    width:118px;
    height:118px;
}

#finishBanner[data-popup-style="compact"] .fin-text{
    font-size:20px;
}

#finishBanner[data-popup-style="compact"] .team-name{
    font-size:18px;
}

#finishBanner[data-popup-style="compact"] .status{
    font-size:32px;
    padding:8px 14px;
}

#finishBanner[data-popup-style="glass"]{
    background:
        linear-gradient(rgba(15,23,42,0.38), rgba(15,23,42,0.38)),
        var(--popup-bg);
    background-blend-mode:normal, screen;
    border:1px solid rgba(255,255,255,0.28);
    border-radius:12px;
    clip-path:none;
    backdrop-filter:blur(10px);
    box-shadow:0 18px 48px rgba(0,0,0,0.75), inset 0 1px 0 rgba(255,255,255,0.18);
}

#finishBanner[data-popup-style="curve_dark"]{
    border-left:2px solid rgba(255,255,255,0.45);
    border-right:9px solid var(--style-accent-color);
    border-top:0;
    border-bottom:0;
    clip-path:polygon(0 0, calc(100% - 28px) 0, 100% 50%, calc(100% - 28px) 100%, 0 100%);
}

#finishBanner[data-popup-style="curve_light"]{
    border:0;
    border-radius:22px;
    clip-path:none;
    background:rgba(30,41,59,0.84);
    box-shadow:0 12px 28px rgba(0,0,0,0.7);
    overflow:hidden;
}

#finishBanner[data-popup-style="scoreboard"]{
    background:var(--table-header-bg);
    border:2px solid #071e22;
    border-radius:0;
    clip-path:none;
    color:var(--popup-text-color);
    box-shadow:0 10px 28px rgba(0,0,0,0.65);
}

#finishBanner[data-popup-animation="none"]{
    transition:none;
}

#finishBanner[data-popup-animation="smooth"]{
    transition:0.7s cubic-bezier(.2,.8,.2,1);
}

#finishBanner.show[data-popup-animation="pop"]{
    animation:popupPop 0.4s ease;
}

#finishBanner.show[data-popup-animation="slide"],
#finishBanner.show[data-popup-animation="slide_io"]{
    animation:popupSlide 0.42s cubic-bezier(.2,.8,.2,1);
}

#finishBanner.show[data-popup-animation="fade_io"]{
    animation:popupFade 0.42s ease;
}

@keyframes popupPop{
    0%{ transform:translateX(-50%) scale(calc(var(--popup-scale) * 0.88)); filter:brightness(1.5); }
    100%{ transform:translateX(-50%) scale(var(--popup-scale)); filter:brightness(1); }
}

@keyframes popupSlide{
    0%{ transform:translateX(-50%) translateY(-35px) scale(var(--popup-scale-hidden)); opacity:0; }
    100%{ transform:translateX(-50%) translateY(0) scale(var(--popup-scale)); opacity:1; }
}

@keyframes popupFade{
    0%{ opacity:0; filter:brightness(1.4); }
    100%{ opacity:1; filter:brightness(1); }
}

/* LEFT LOGO */
.left-box{
    background:#f1f5f9;
    padding:0px;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:inset -4px 0 12px rgba(0,0,0,0.4);
}

.left-box img{
    width:162px;
    height:162px;
}

/* RIGHT */
.right-box{
    display:flex;
    flex-direction:column;
}

/* ðŸ”¥ COMMON ANGLED BAR */
.angled{
    position:relative;
    padding:10px 35px 10px 16px;
}

/* FIN */
.top-row{
    background:var(--popup-bg);
    z-index:3;
}

.fin-text{
    font-size:26px;
    font-weight:800;
    letter-spacing:1px;
}

/* TEAM */
.team-name{
    background:linear-gradient(90deg,#0f172a,#1e293b);
    font-size:22px;
    font-weight:700;
    margin-top:-8px;
    z-index:2;
}

/* ELIMINATED */
.status{
    background:var(--popup-bg);
    padding:12px 18px;
    font-size:44px;
    font-weight:900;
    letter-spacing:2px;
    margin-top:-8px;
}

/* ================= TABLE ================= */
.container{
    position:absolute;
    right:20px;
    bottom:10px;

    width:var(--table-width);

    backdrop-filter: blur(10px);
    border:1px solid rgba(0,255,200,0.15);

    box-shadow:
        0 10px 40px rgba(0,0,0,0.8),
        0 0 20px rgba(0,255,200,0.1);

    border-radius:10px;
    overflow:hidden;
}

#tableWrapper{
    opacity:1;
    visibility:visible;
    transition:opacity 320ms ease, visibility 0s linear 0s;
    will-change:opacity;
}

#tableWrapper[data-visible="false"]{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity 320ms ease, visibility 0s linear 320ms;
}

/* Visibility is opacity-only until its fade has finished: OBS receives a
   stable transparent frame instead of display toggling/flicker. */
#tableWrapper[data-visible="true"]{ pointer-events:auto; }

body[data-table-font="story_script"]{ --overlay-font:'Story Script', cursive; }
body[data-table-font="lobster"]{ --overlay-font:'Lobster', cursive; }
body[data-table-font="asset"]{ --overlay-font:'Asset', serif; }
body[data-table-font="ewert"]{ --overlay-font:'Ewert', serif; }
body[data-table-font="teko"]{ --overlay-font:'Teko', sans-serif; }
body[data-table-font="oswald"]{ --overlay-font:'Oswald', sans-serif; }
body[data-table-font="orbitron"]{ --overlay-font:'Orbitron', sans-serif; }
body[data-table-font="barlow"]{ --overlay-font:'Barlow Condensed', sans-serif; }
body[data-header-font="rajdhani"]{ --header-font:'Rajdhani', sans-serif; }
body[data-header-font="teko"]{ --header-font:'Teko', sans-serif; }
body[data-header-font="oswald"]{ --header-font:'Oswald', sans-serif; }
body[data-header-font="orbitron"]{ --header-font:'Orbitron', sans-serif; }
body[data-header-font="barlow"]{ --header-font:'Barlow Condensed', sans-serif; }
body[data-header-font="story_script"]{ --header-font:'Story Script', cursive; }
body[data-header-font="lobster"]{ --header-font:'Lobster', cursive; }
body[data-match-font="rajdhani"]{ --match-font:'Rajdhani', sans-serif; }
body[data-match-font="teko"]{ --match-font:'Teko', sans-serif; }
body[data-match-font="oswald"]{ --match-font:'Oswald', sans-serif; }
body[data-match-font="orbitron"]{ --match-font:'Orbitron', sans-serif; }
body[data-match-font="barlow"]{ --match-font:'Barlow Condensed', sans-serif; }
body[data-match-font="story_script"]{ --match-font:'Story Script', cursive; }
body[data-match-font="lobster"]{ --match-font:'Lobster', cursive; }

/* ðŸ”¥ MATCH BAR (ONLY ADDITION) */
#matchBar{
    display:flex;
    align-items:stretch;
    justify-content:flex-start;
    gap:0;
    text-align:left;
    font-weight:800;

    min-height:44px;
    padding:0;

    background:var(--table-header-bg);
    border-bottom:0;

    clip-path:none;

    width:100%;   /* important */
    box-sizing:border-box;
}

/* ALIVE COUNTERS (ONLY ADDITION) */
#matchCounters{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    width:100%;
    box-sizing:border-box;
    min-height:var(--counter-bar-height);
    padding:4px 12px;
    background:var(--counter-bg);
    color:var(--counter-text-color);
    font-weight:800;
    border-bottom:1px solid rgba(255,255,255,0.18);
}
#matchCounters[data-visible="false"]{
    display:none;
}
.counter-item{
    display:flex;
    align-items:center;
    gap:6px;
}
.counter-label{
    font-size:10px;
    letter-spacing:1px;
    opacity:0.85;
}
.counter-value{
    font-size:15px;
    min-width:20px;
    text-align:center;
}

.header{
    display:grid;
    grid-template-columns:30px 1fr 28px 25px 30px 40px;
    background:var(--table-header-bg);
    min-height:var(--table-header-height, var(--table-row-height));
    font-family:var(--header-font, var(--overlay-font));
    align-items:center;
    padding:0 var(--table-row-pad-x);
    font-size:var(--table-header-font-size);
    border-top:1px solid rgba(255,255,255,0.18);
}

#matchText{
    font-family:var(--match-font, var(--overlay-font));
    flex:0 0 74px;
    min-width:74px;
    height:44px;
    display:grid;
    align-content:start;
    text-align:left;
    padding:4px 6px 4px 12px;
    box-sizing:border-box;
}

#mapImage{
    width:130px;
    height:auto;
    object-fit:cover;
    object-position:center;
    border-left:1px solid rgba(255,255,255,0.35);
    border-right:1px solid rgba(255,255,255,0.25);
    margin-right:0;
    margin-top:0;
    align-self:stretch;
}

#mapText{
    flex:1 1 auto;
    min-width:0;
    color:var(--map-text-color);
    font-weight:900;
    font-size:18px;
    line-height:1.05;
    white-space:normal;
    overflow-wrap:anywhere;
    word-break:break-word;
    overflow:hidden;
    display:grid;
    align-content:start;
    text-align:left;
    align-self:stretch;
    padding:4px 8px;
    box-sizing:border-box;
    text-shadow:0 0 5px rgba(0,0,0,0.75);
}

.row{
    display:grid;
    grid-template-columns:18px 1fr 28px 25px 30px 40px;
    align-items:center;
    min-height:var(--table-row-height);
    padding:0 var(--table-row-pad-x);
    font-size:var(--table-row-font-size);
    transition:transform 0.45s cubic-bezier(.2,.8,.2,1), opacity 0.35s ease, filter 0.35s ease;
    will-change:transform, opacity;
    border-bottom:var(--row-divider-width) solid rgba(255,255,255,0.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.08);
}

.row:nth-child(even){ background:linear-gradient(100deg,#111827,#030712); }
.row:nth-child(odd){ background:linear-gradient(100deg,#172033,#07101f); }

.row.alive{
    background:var(--alive-team-bg);
}

.row.finished{
    background:var(--finished-team-bg) !important;
    opacity:0.8;
}

.team{
    display:flex;
    align-items:center;
    gap:3px;
}

.logo{
    width:var(--table-logo-size);
    height:var(--table-logo-size);
    border:2px solid white;
    border-radius:5px;
}

/* ALIGN */
[data-col="chicken"],
[data-col="kills"],
[data-col="total"]{
    text-align:center;
}

[data-col="status"]{
    text-align:right;
}

/* HEADER NUDGE (click title -> arrow keys move it) */
.header [data-col]{cursor:move;}
.header [data-col].d4t-header-selected{outline:2px dashed #ffd400;outline-offset:-2px;}
#d4tNudgeHint{position:fixed;right:8px;bottom:8px;z-index:99999;background:rgba(0,0,0,.78);color:#ffd400;font:12px/1.5 monospace;padding:6px 10px;border-radius:6px;pointer-events:none;display:none;white-space:pre;}
.row [data-col="logo"]{display:flex;align-items:center;justify-content:center;}
.header [data-col="logo"]{font-size:.72em;opacity:.85;}

.chicken-head{
    font-size:15px;
    line-height:1;
    filter:drop-shadow(0 0 4px rgba(255,215,0,0.7));
}

/* ALIVE BARS */
.alive-box{
    display:flex;
    justify-content:flex-end;
    gap:var(--status-bar-gap);
}

.bar{
    width:var(--status-bar-width);
    height:var(--status-bar-height);
    border-radius:var(--status-bar-radius);

const DUALPC_LOCAL_URL = "http://127.0.0.1:8770/api/v1/master/live";

function readLiveUrl(){
    let searchParams = new URLSearchParams(window.location.search || "");
    let live = (searchParams.get("live") || "").trim();
    if(live) return live;
    return null;
}

// Customer-hash routing: ?key=<CUSTOMER_HASH> maps to the customer's active
// DualPC session via the public /api/v1/live/<hash> endpoint.
function readCustomerKey(){
    let searchParams = new URLSearchParams(window.location.search || "");
    let key = (searchParams.get("key") || "").trim();
    if(key) return key;
    return "";

const IS_LOCAL_OVERLAY = ["localhost", "127.0.0.1"].includes(window.location.hostname);

const DUALPC_PUBLIC_URL = "https://dualpc-server.onrender.com";

function shouldShowTable(layout, aliveTeams){
    if(!layout.table_visible) return false;
    if(!layout.auto_hide_table_top4) return true;
    let alive = parseInt(aliveTeams, 10);
    return !Number.isFinite(alive) || alive > 4;
}

function tableAliveTeams(data){
    const activeRows = Array.isArray(data && data.teams) ? data.teams.filter(team =>
        Number(team.alive) > 0
    ).length : 0;
    // The team rows are authoritative for the Top-4 presentation when the
    // counter OCR is delayed or stale.  Do not override normal higher counts.
    return activeRows > 0 && activeRows <= 4 ? activeRows : data.alive_teams;
}

/* Layout contract bridge: keeps every legacy-compatible template in sync with
   the Python overlay_layout payload. */
const d4tNormalizeLayoutBase = normalizeLayout;
normalizeLayout = function(layout){
    const clean = d4tNormalizeLayoutBase(layout);
    const raw = layout || {};
    const number = (key, fallback, min, max) => {
        let value = parseInt(raw[key] ?? fallback, 10);
        if(Number.isNaN(value)) value = fallback;
        return Math.max(min, Math.min(max, value));
    };
    clean.table_text_size = number("table_text_size", 13, 8, 36);
    clean.table_header_text_size = number("table_header_text_size", 12, 8, 28);
    clean.table_logo_size = number("table_logo_size", 22, 12, 44);
    clean.table_bar_height = number("table_bar_height", 14, 4, 40);
    clean.status_bar_height = number("status_bar_height", 14, 4, 40);
    clean.status_bar_radius = number("status_bar_radius", 2, 0, 20);
    clean.status_bar_animation_speed = number("status_bar_animation_speed", 450, 0, 3000);
    clean.row_divider_width = number("row_divider_width", raw.row_border_thickness ?? 1, 0, 8);
    tableColumns.forEach(column => clean[column.widthKey] = number(column.widthKey, defaultOverlayLayout[column.widthKey], 12, 420));
    ["table_style", "top5_style", "popup_style"].forEach(key => {
        if(["modern_glass", "esports_neon_pro", "cyber_dark"].includes(raw[key])) clean[key] = raw[key];
    });
    clean.debug_overlay_layout = layoutBool(raw, "debug_overlay_layout");
    return clean;
};
const d4tApplyOverlayLayoutBase = applyOverlayLayout;
applyOverlayLayout = function(layout, aliveTeams){
    const clean = d4tApplyOverlayLayoutBase(layout, aliveTeams);
    const root = document.documentElement.style;
    root.setProperty("--table-row-font-size", clean.table_text_size + "px");
    root.setProperty("--table-header-font-size", clean.table_header_text_size + "px");
    root.setProperty("--table-logo-size", clean.table_logo_size + "px");
    root.setProperty("--table-bar-height", clean.table_bar_height + "px");
    root.setProperty("--status-bar-height", clean.status_bar_height + "px");
    root.setProperty("--status-bar-radius", clean.status_bar_radius + "px");
    root.setProperty("--status-bar-animation-speed", clean.status_bar_animation_speed + "ms");
    root.setProperty("--row-divider-width", clean.row_divider_width + "px");
    tableColumns.forEach(column => root.setProperty(`--${column.widthKey.replaceAll("_", "-")}`, clean[column.widthKey] + "px"));
    document.querySelectorAll("#teams .row").forEach(row => row.style.borderBottomWidth = clean.row_divider_width + "px");
    document.querySelectorAll(".alive-box .bar").forEach(bar => {
        bar.style.height = clean.status_bar_height + "px";
        bar.style.borderRadius = clean.status_bar_radius + "px";
        bar.style.transitionDuration = clean.status_bar_animation_speed + "ms";
    });
    if(clean.debug_overlay_layout) {
        console.groupCollapsed("D4T layout debug");
        tableColumns.forEach(column => console.log(`${column.widthKey}: JSON=${clean[column.widthKey]} CSS=${getComputedStyle(document.documentElement).getPropertyValue(`--${column.widthKey.replaceAll("_", "-")}`).trim()} DOM=${getComputedStyle(document.querySelector(".row") || document.querySelector(".header")).gridTemplateColumns}`));
        console.groupEnd();
    }
    return clean;
};

    if(!visibleColumns.length) visibleColumns = tableColumns;

/* ===== HEADER COLUMN NUDGE (click title -> arrow keys move it) ===== */
(function(){
    const NUDGE_KEY = "d4t_header_col_offsets";
    let nudgeSelected = null;
    let nudgeOffsets = {};
    let nudgeHint = null;
    try{
        nudgeOffsets = JSON.parse(localStorage.getItem(NUDGE_KEY) || "{}") || {};
    }catch(err){
        nudgeOffsets = {};
    }

    function nudgeEnsureHint(){
        if(nudgeHint) return nudgeHint;
        nudgeHint = document.createElement("div");
        nudgeHint.id = "d4tNudgeHint";
        document.body.appendChild(nudgeHint);
        return nudgeHint;
    }
    function nudgeShowHint(){
        const el = nudgeEnsureHint();
        const l = nudgeOffsets[nudgeSelected] || {x:0, y:0};
        const src = nudgeCleanLayout || {};
        const off = {
            x: (parseInt(src["table_col_" + nudgeSelected + "_dx"] ?? 0, 10) || 0) + (l.x||0),
            y: (parseInt(src["table_col_" + nudgeSelected + "_dy"] ?? 0, 10) || 0) + (l.y||0)
        };
        el.style.display = "block";
        el.textContent = "[" + nudgeSelected.toUpperCase() + "] arrows=move | shift=x10 | del=reset | esc=done (" + off.x + "," + off.y + ")";
    }
    function nudgeHideHint(){
        if(nudgeHint) nudgeHint.style.display = "none";
    }
    let nudgeCleanLayout = null;
    function nudgeApply(col){
        const cols = ["rank", "team", "logo", "chicken", "kills", "total", "status"];
        cols.forEach(c=>{
            const src = nudgeCleanLayout || {};
            const jx = parseInt(src["table_col_" + c + "_dx"] ?? 0, 10) || 0;
            const jy = parseInt(src["table_col_" + c + "_dy"] ?? 0, 10) || 0;
            const l = nudgeOffsets[c] || {x:0, y:0};
            document.querySelectorAll(`.header [data-col="${c}"]`).forEach(el=>{
                el.style.transform = `translate(${jx + (l.x||0)}px, ${jy + (l.y||0)}px)`;
                el.classList.toggle("d4t-header-selected", nudgeSelected === c);
            });
        });
    }
    function nudgeSave(){
        try{ localStorage.setItem(NUDGE_KEY, JSON.stringify(nudgeOffsets)); }catch(err){}
    }
    function nudgeDeselect(){
        if(!nudgeSelected) return;
        const col = nudgeSelected;
        nudgeSelected = null;
        document.querySelectorAll(`.header [data-col="${col}"]`).forEach(el=>el.classList.remove("d4t-header-selected"));
        nudgeHideHint();
    }

    document.addEventListener("click", ev=>{
        const cell = ev.target.closest(".header [data-col]");
        if(cell){
            const col = cell.getAttribute("data-col");
            if(nudgeSelected && nudgeSelected !== col){
                document.querySelectorAll(`.header [data-col="${nudgeSelected}"]`).forEach(el=>el.classList.remove("d4t-header-selected"));
            }
            nudgeSelected = col;
            nudgeApply(col);
            nudgeShowHint();
        }
    });

    document.addEventListener("keydown", ev=>{
        if(!nudgeSelected) return;
        if(ev.key === "Escape"){
            nudgeDeselect();
            return;
        }
        if(ev.key === "Delete" || ev.key === "Backspace"){
            ev.preventDefault();
            nudgeOffsets[nudgeSelected] = {x:0, y:0};
            nudgeApply(nudgeSelected);
            nudgeSave();
            nudgeShowHint();
            return;
        }
        const step = ev.shiftKey ? 10 : 1;
        const moves = {
            ArrowLeft: [-step, 0],
            ArrowRight: [step, 0],
            ArrowUp: [0, -step],
            ArrowDown: [0, step]
        };
        const move = moves[ev.key];
        if(!move) return;
        ev.preventDefault();
        const cur = nudgeOffsets[nudgeSelected] || {x:0, y:0};
        cur.x += move[0];
        cur.y += move[1];
        nudgeOffsets[nudgeSelected] = cur;
        nudgeApply(nudgeSelected);
        nudgeSave();
        nudgeShowHint();
    });

    const d4tApplyTableColumnsBase = applyTableColumns;
    applyTableColumns = function(layout){
        const result = d4tApplyTableColumnsBase(layout);
        nudgeCleanLayout = layout || {};
        nudgeApply();
        return result;
    };
    nudgeApply();
})();

function animateTableRows(previousPositions, animationStyle){
    if(animationStyle === "none") return;

    let duration = animationStyle === "smooth" ? 700 : 430;
    document.querySelectorAll("#teams .row").forEach(row=>{
        let previousTop = previousPositions[row.dataset.teamKey];
        if(previousTop === undefined){
            if(animationStyle === "pop"){
                row.classList.add("anim-pop");
                setTimeout(()=>row.classList.remove("anim-pop"), 420);
            }else if(animationStyle === "slide_io"){
                row.classList.add("anim-slide-io");
                setTimeout(()=>row.classList.remove("anim-slide-io"), 460);
            }else if(animationStyle === "fade_io"){
                row.classList.add("anim-fade-io");
                setTimeout(()=>row.classList.remove("anim-fade-io"), 460);
            }
            return;
        }

        let currentTop = row.getBoundingClientRect().top;
        let deltaY = previousTop - currentTop;
        if(Math.abs(deltaY) < 1){
            if(animationStyle === "pop"){
                row.classList.add("anim-pop");
                setTimeout(()=>row.classList.remove("anim-pop"), 420);
            }else if(animationStyle === "fade_io"){
                row.classList.add("anim-fade-io");
                setTimeout(()=>row.classList.remove("anim-fade-io"), 460);
            }
            return;
        }

        row.style.transition = "none";
        row.style.transform = `translateY(${deltaY}px)`;
        if(animationStyle === "pop") row.classList.add("anim-pop");
        if(animationStyle === "fade_io") row.style.opacity = "0.35";

        requestAnimationFrame(()=>{
            row.style.transition = `transform ${duration}ms cubic-bezier(.2,.8,.2,1), opacity 350ms ease, filter 350ms ease`;
            row.style.transform = "";
            row.style.opacity = "";
            if(animationStyle === "pop"){
                setTimeout(()=>row.classList.remove("anim-pop"), 420);
            }
        });
    });
}

function fitMapText(){
    let text = document.getElementById("mapText");
    if(!text) return;

    let baseSize = parseInt(text.dataset.baseSize || defaultOverlayLayout.map_text_size, 10);
    let boxHeight = parseInt(text.dataset.boxHeight || defaultOverlayLayout.map_text_height, 10);
    if(Number.isNaN(baseSize)) baseSize = defaultOverlayLayout.map_text_size;
    if(Number.isNaN(boxHeight)) boxHeight = defaultOverlayLayout.map_text_height;
    baseSize = Math.max(8, Math.min(64, baseSize));
    boxHeight = Math.max(40, Math.min(180, boxHeight));
    let matchBar = document.getElementById("matchBar");
    if(matchBar){
        let baseHeight = parseInt(matchBar.dataset.baseHeight || "0", 10);
        matchBar.style.minHeight = Math.max(46, boxHeight + 7, Number.isNaN(baseHeight) ? 0 : baseHeight) + "px";
    }
    text.style.height = boxHeight + "px";
    text.style.maxHeight = boxHeight + "px";
    let sizes = [baseSize, baseSize - 2, baseSize - 4, baseSize - 6, baseSize - 8, 10, 8]
        .filter((size, index, arr)=>size >= 8 && arr.indexOf(size) === index);
    for(let size of sizes){
        text.style.setProperty("font-size", size + "px", "important");
        if(text.scrollHeight <= text.clientHeight + 1 && text.scrollWidth <= text.clientWidth + 1){
            break;
        }
    }
}

function cleanTeamName(team){
    return String(team || "default").trim();
}

// Authoritative display name for a team/logo search: prefer team_name, then
// the legacy .team string, then the numeric team_no as "Team<no>".
function teamDisplayName(row){
    if(!row) return "default";
    if(row.team_name) return cleanTeamName(row.team_name);
    if(row.team) return cleanTeamName(row.team);
    if(row.team_no !== undefined && row.team_no !== null) return "Team" + row.team_no;
    return "default";
}

function logoPath(base, name, ext){
    return base + encodeURIComponent(name).replace(/%2F/gi, "") + "." + ext;
}

function getLogo(team){
    return getLogoVariants(team)[0];
}

function getTeamLogoUrl(row, teamLogos){
    teamLogos = teamLogos || {};
    let team = teamDisplayName(row);

    if(team && teamLogos[team]){
        return teamLogos[team];
    }
    if(row && row.team_no !== undefined && row.team_no !== null && teamLogos["Team" + row.team_no]){
        return teamLogos["Team" + row.team_no];
    }

    let match = team.match(/\d+/);
    if(match && teamLogos["Team" + match[0]]){
        return teamLogos["Team" + match[0]];
    }

    return "";
}

function getLogoVariants(team){
    let name = cleanTeamName(team);
    let noSpace = name.replace(/\s/g, "");
    let lowerNoSpace = name.toLowerCase().replace(/\s/g, "");

    let names = [name, noSpace, lowerNoSpace, name.toLowerCase(), name.toUpperCase()];
    let exts = ["png", "PNG", "jpg", "jpeg", "webp"];
    let bases = ["logos/"];
    let variants = [];

    bases.forEach(base=>{
        names.forEach(item=>{
            exts.forEach(ext=>{
                variants.push(logoPath(base, item, ext));
            });
        });
        variants.push(base + "default.png");
    });

    return variants.filter((value, index, arr)=>value && arr.indexOf(value) === index);
}

function logoFallback(img){
    let variants = JSON.parse(img.dataset.variants || "[]");
    let index = parseInt(img.dataset.index || "0", 10) + 1;

    if(index < variants.length){
        img.dataset.index = index;
        img.src = variants[index];
    }else{
        img.onerror = null;
        img.src = "logos/default.png";
    }
}

function logoImgTag(className, row, teamLogos){
    let team = teamDisplayName(row);
    let serverLogo = getTeamLogoUrl(row, teamLogos);
    let variants = getLogoVariants(team);
    if(serverLogo) variants.push(serverLogo);
    variants.push("logos/default.png");
    variants = variants.filter((value, index, arr)=>value && arr.indexOf(value) === index);
    return `<img class="${className}" src="${variants[0]}" data-index="0" data-variants='${JSON.stringify(variants)}' onerror="logoFallback(this)">`;
}
function aliveBars(n){
    let h="";
    for(let i=0;i<4;i++){
        h+=`<div class="bar ${i<n?'active':''}"></div>`;
    }
    return h;
}

function renderWinChances(chances, layout, teamLogos){
    let box = document.getElementById("winChance");
    if(!box) return;
    if(!layout.show_win_chance || !Array.isArray(chances) || chances.length < 2 || chances.length > 4){
        box.innerHTML = "";
        return;
    }
    box.innerHTML = chances.map(item=>`
        <div class="win-card">
            <div class="win-card-main">
                ${logoImgTag("win-logo", item, teamLogos)}
                <div class="win-bars">${aliveBars(item.alive || 0)}</div>
            </div>
            <div class="win-label">WWCD - ${item.win_percent || 0}%</div>
        </div>
    `).join("");
}

function showPopup(team,kills,aliveTeams,logoUrl){

    let banner = document.getElementById("finishBanner");

    document.getElementById("popupTeam").innerText = team;
    document.getElementById("popupKill").innerText = kills + " FINISHES";

    let popupLogo = document.getElementById("popupLogo");
    let variants = getLogoVariants(team);
    if(logoUrl) variants.push(logoUrl);
    variants.push("logos/default.png");
    variants = variants.filter((value, index, arr)=>value && arr.indexOf(value) === index);
    popupLogo.dataset.index = "0";
    popupLogo.dataset.variants = JSON.stringify(variants);
    popupLogo.onerror = function(){
        logoFallback(this);
    };
    popupLogo.src = variants[0];

    if(Number.isFinite(finishPos)){
        document.getElementById("popupTeam").innerText = "#" + finishPos + " - " + team;

    let item = popupQueue.shift();

    setTimeout(()=>{

        playNextPopup();

function hasRenderableData(data){

}
function update(data){
    if(!hasRenderableData(data)){
        document.body.classList.add("ready");
        return;
    }

    let signature = JSON.stringify({
        remaining_players: data.remaining_players || "",
        alive_teams: data.alive_teams || "",
        match_no: data.match_no || 1,

        top_players: data.top_players || [],
        finish_events: data.finish_events || [],
        show_top5: !!data.show_top5,
        show_popup: data.show_popup !== false,
        team_logos: data.team_logos || {},
        overlay_layout: data.overlay_layout || {}
    });
    if(signature === lastRenderedSignature) return;
    lastRenderedSignature = signature;

    let incomingLayout = data.overlay_layout && Object.keys(data.overlay_layout).length
    ? data.overlay_layout
    : lastValidOverlayLayout;

if (incomingLayout) {
    lastValidOverlayLayout = incomingLayout;
}

let layout = normalizeLayout(incomingLayout || defaultOverlayLayout);
    const teamLogos = data.team_logos || {};
    // Render Win Chance first so Top 4 auto-hide follows its real visibility.
    renderWinChances(data.win_chances || [], layout, teamLogos);
    layout = applyOverlayLayout(layout, tableAliveTeams(data));
    let previousPositions = getRowPositions();

    // ðŸ”¥ MATCH NO UPDATE (ONLY ADDITION)
    document.getElementById("matchText").innerText = "MATCH " + (data.match_no || 1);

    // ALIVE COUNTERS (ONLY ADDITION) - summed from per-team OCR alive counts
    let matchCounters = document.getElementById("matchCounters");
    if(matchCounters){
        let counterPlayers = 0;
        let counterTeams = 0;
        let counterFinTeams = 0;
        (data.teams || []).forEach((t)=>{
            let aliveVal = Number(t.alive) || 0;
            counterPlayers += aliveVal;
            if(aliveVal > 0) counterTeams++;
            // A team is COMPLETELY finished only when team.alive === 0.
            // team.finished is NEVER used here - individual finished players
            // must not increment the TEAM # FIN counter.
            if(Number(t.alive) === 0) counterFinTeams++;
        });
        let playersEl = document.getElementById("alivePlayersCount");
        let teamsEl = document.getElementById("aliveTeamsCount");
        let finEl = document.getElementById("finishedTeamsCount");
        if(playersEl) playersEl.innerText = counterPlayers;
        if(teamsEl) teamsEl.innerText = counterTeams;
        if(finEl) finEl.innerText = counterFinTeams;
    }

    // Group the flat top-level players[] by their authoritative team_no so
    // individual player status (player.alive/status/finish) can be used.
    let playersByTeam = {};
    (data.players || []).forEach(player=>{
        let teamNo = Number(player.team_no);
        if(!Number.isFinite(teamNo)) return;
        (playersByTeam[teamNo] = playersByTeam[teamNo] || []).push(player);
    });

    // Real Total Points (TP) from the existing scoring system. Prefer the
    // dedicated points field carried by the Main PC (`tp`); treat as available
    // only when a genuine points value exists. NEVER reuse ALIVE/TOTAL.
    function teamTP(t){
        if(t==null) return null;
        if(t.tp!=null) return Number(t.tp)||0;
        if(t.points!=null) return Number(t.points)||0;
        if(t.total_points!=null) return Number(t.total_points)||0;
        if(t.placement!=null) return Number(t.placement)||0;
        return null;
    }
    let tpTeams = (data.teams || []);
    const tpEnabled = layoutBool(layout, "show_total");
    const tpAvailable = tpEnabled && tpTeams.some(t=>teamTP(t)!=null);

    let teams = (data.teams || []).map(team=>{
        let teamNo = Number(team.team_no);
        if(Number.isFinite(teamNo) && playersByTeam[teamNo]){
            team = Object.assign({}, team, { players: playersByTeam[teamNo].slice() });
        } else {
            team = Object.assign({}, team, { players: (team.players || []).slice() });
        }
        return team;
    }).sort((a,b)=>{
        if(tpAvailable){
            let totalA = teamTP(a)||0;
            let totalB = teamTP(b)||0;
            if(totalB!==totalA) return totalB-totalA;

            let aliveA = Number(a.alive)||0;
            let aliveB = Number(b.alive)||0;

            if(aliveB!==aliveA) return aliveB-aliveA;

            return (Number(b.kills)||0)-(Number(a.kills)||0);
        }

        if((Number(b.kills)||0)!==(Number(a.kills)||0)) return (Number(b.kills)||0)-(Number(a.kills)||0);

        let aliveA = Number(a.alive)||0;
        let aliveB = Number(b.alive)||0;

        return aliveB-aliveA;
    });
    let html="";

    teams.forEach((t,i)=>{
        let teamNo = Number(t.team_no);
        let isFinished = (Number(t.alive) === 0);
        let key = Number.isFinite(teamNo) ? "t" + teamNo : rowKey(t.team_name || t.team);
        let teamName = t.team_name || t.team || "Team";
        html+=`
        <div class="row ${isFinished ? 'finished' : 'alive'}" id="team-${key}" data-team-key="${key}">
            <div data-col="rank">${i+1}</div>
            <div data-col="logo">${logoImgTag("logo", t, teamLogos)}</div>
            <div data-col="team" class="team">
                ${teamName}
            </div>
            <div data-col="chicken">${t.chicken||0}</div>
            <div data-col="kills">${t.kills||0}</div>
            <div data-col="total">${teamTP(t)!=null ? teamTP(t) : "&mdash;"}</div>
            <div data-col="status" class="alive-box">
                ${aliveBars(isFinished ? 0 : (Number(t.alive)||0))}
            </div>
        </div>`;
    });

    document.getElementById("teams").innerHTML = html;
    layout = applyOverlayLayout(layout, tableAliveTeams(data));
    applyTableColumns(layout);
    animateTableRows(previousPositions, layout.animation_style);

    let matchNo = data.match_no || 1;

if(currentMatchNo !== matchNo){
    currentMatchNo = matchNo;
    popupQueue = [];
    popupPlaying = false;
    lastFinished = null;
}

let popupEnabled = data.show_popup !== false;
if(!popupEnabled){
    popupQueue = [];
    popupPlaying = false;
    document.getElementById("finishBanner").classList.remove("show");
    teams.forEach(t=>{
        if(Number(t.alive) === 0){
            markFinishPopupShown(finishPopupKey(matchNo, t.team_name || t.team));
        }
    });
}

let finishEvents = Array.isArray(data.finish_events) ? data.finish_events : [];

if(popupEnabled) finishEvents.forEach(ev=>{
    if(!ev) return;

    let eventTeam = ev.team || (ev.team_no ? "Team" + ev.team_no : "TEAM");
    let eventKey = "finish_event:" + String(ev.id || ((ev.match_no || matchNo) + "_" + rowKey(eventTeam)));

    if(!shownFinishedTeams.has(eventKey)){
        markFinishPopupShown(eventKey);
        markFinishPopupShown(finishPopupKey(matchNo, eventTeam));
        lastFinished = eventTeam;

        let eventRow = { team: eventTeam, team_no: ev.team_no, team_name: ev.team_name || ev.team };
        queuePopup(eventTeam, ev.kills || 0, ev.alive_teams || data.alive_teams, getTeamLogoUrl(eventRow, teamLogos));

        let row = document.getElementById("team-"+rowKeyTeam(eventRow));
        if(row){
            row.classList.add("flash");
            setTimeout(()=>{
                row.classList.remove("flash");
            },700);
        }
    }
});

if(popupEnabled) teams.forEach(t=>{
    if(Number(t.alive) > 0) return;

    let key = finishPopupKey(matchNo, t.team_name || t.team);

    if(!shownFinishedTeams.has(key)){
        markFinishPopupShown(key);
        lastFinished = t.team_name || t.team;

        queuePopup(t.team_name || t.team, t.kills, data.alive_teams, getTeamLogoUrl(t, teamLogos));

        let row = document.getElementById("team-"+rowKeyTeam(t));

        if(row){
    row.classList.add("flash");

    setTimeout(()=>{
        row.classList.remove("flash");
    },700);
}
    }
});

    let topHTML="";
    const top5Enabled = !!data.show_top5;
    if(top5Enabled){
        let topPlayers = Array.isArray(data.top_players) ? data.top_players : [];
        // DualPC merged state has no top_players[]; derive the top cards from
        // the authoritative flat players[] (highest kills) when absent.
        if(topPlayers.length === 0 && Array.isArray(data.players) && data.players.length){
            topPlayers = data.players
                .slice()
                .sort((x,y)=>((Number(y.kills)||0)-(Number(x.kills)||0)))
                .slice(0, 5);
        }
        topPlayers.forEach((p,i)=>{
            let playerDead = !!(p.finish === true || p.status === "finished" || p.alive === false);
            topHTML+=`
            <div class="top-card">
                ${logoImgTag("top-logo", p, teamLogos)}
                <div class="top-text">
                    #${i+1}<br>
                    ${p.team_name || p.team || ("Team" + (p.team_no != null ? p.team_no : ""))}<br>
                    ${p.player_name || p.name || "?"}<br>
                    <span class="${playerDead ? 'finished' : ''}">${p.kills} KILLS</span>
                </div>
            </div>`;
        });
    }

    document.getElementById("top5").innerHTML = topHTML;

    let wwcdOverlay = document.getElementById("wwcdOverlay");
    let wwcdVideo = document.getElementById("wwcdVideo");
    let wwcdImage = document.getElementById("wwcdImage");
    if(data.wwcd_video){
        if(wwcdOverlay.style.display === "none"){
            wwcdOverlay.style.display = "block";
            wwcdImage.style.display = "none";
            wwcdVideo.src = IS_LOCAL_OVERLAY ? "/data/wwcd/WWCD.mp4" : "wwcd/WWCD.mp4";
            wwcdImage.src = IS_LOCAL_OVERLAY ? "/data/match%20end/match%20end.png" : "match%20end/match%20end.png";
            wwcdVideo.loop = false;
            wwcdVideo.dataset.wwcdPlayCount = "0";
            wwcdVideo.onended = function(){
                let count = parseInt(wwcdVideo.dataset.wwcdPlayCount || "0") + 1;
                wwcdVideo.dataset.wwcdPlayCount = count;
                if(count < 2){ wwcdVideo.play().catch(function(){}); }
                else { wwcdVideo.style.display = "none"; wwcdImage.style.display = "block";
                    setTimeout(function(){ wwcdImage.style.display = "none"; wwcdOverlay.style.display = "none"; }, 10000);
                }
            };
            wwcdVideo.style.display = "block";
            wwcdVideo.play().catch(function(){});
        }
    } else {
        if(wwcdOverlay.style.display !== "none"){
            wwcdVideo.pause();
            wwcdVideo.currentTime = 0;
            wwcdVideo.onended = null;
            wwcdOverlay.style.display = "none";
            wwcdImage.style.display = "none";
        }
    }

    document.body.classList.add("ready");
}

function fetchData(){
    if(IS_FILE_OVERLAY){
        document.body.classList.add("ready");
        document.getElementById("teams").innerHTML = `
            <div class="row alive">
                <div data-col="rank">!</div>
                <div data-col="team" class="team">Open this overlay from launcher: Open Local HTML</div>
                <div data-col="chicken">-</div>
                <div data-col="kills">-</div>
                <div data-col="total">-</div>
                <div data-col="status" class="alive-box"></div>
            </div>`;
        console.log("Direct file open cannot fetch live state. Serve this side over http(s) or use ?live=<url> to point at the DualPC local/remote endpoint.");
        return;
    }

    fetch(API_BASE_URL + "?nocache=" + Date.now(), {
        cache: "no-store"
    })
    .then(r=>{
        if(!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
    })
    .then(update)
    .catch(err=>{
        console.log("overlay data error", err);
        document.body.classList.add("ready");
    });
}

setInterval(fetchData,2000);
fetchData();

</script>
